<ion-app>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100&display=swap" rel="stylesheet">
  
  <ion-menu color="primary" contentId="main-content" type="overlay">
    <ion-content class="custom-dropdown-menu">
      <ion-list id="inbox-list" lines="none">
        <ion-item>
          <ion-avatar>
            <ion-icon name="person-outline" style="font-size: 30px;" routerLink="/perfil"></ion-icon>
          </ion-avatar>
          <ion-list-header style="font-size: 18px;">Dario Almeida Garcia</ion-list-header>
          <ion-icon name="log-out" style="font-size: 30px;" (onclick)="logout()"></ion-icon>
        </ion-item>
      </ion-list>
      <ion-list id="inbox-list" lines="none">
        <ion-item routerLink="/la-clinica">
          <ion-icon name="home" style="padding-right: 10px;"></ion-icon>
          La clinica
        </ion-item>
        <ion-item routerLink="/equipo">
          <ion-icon name="people" style="padding-right: 10px;"></ion-icon>
          Cuadro Clinico
        </ion-item>
        <ion-item routerLink="/noticias">
          <ion-icon name="newspaper" style="padding-right: 10px;"></ion-icon>
          Noticias
        </ion-item> 
        <ion-item routerLink="/kid_planet">
          <ion-icon name="send" style="padding-right: 10px;"></ion-icon>
          Kid Planet
        </ion-item>
      </ion-list>
      <ion-list lines="none">
        <ion-item>
          Su cita:
          <ion-icon slot="end" name="arrow-down-outline" *ngIf="!showList" (click)="toggleList()"></ion-icon>
          <ion-icon slot="end" name="arrow-up-outline" *ngIf="showList" (click)="toggleList()"></ion-icon>
        </ion-item>
        <div style="margin-left: 1em;" *ngIf="showList" >
          <ion-item *ngFor="let item of citas"> {{item.dia}} {{item.hora}}</ion-item> 
        </div>
        <ion-item>
          Mapa va aqui
        </ion-item>
      </ion-list>
    </ion-content>
    
  </ion-menu>
  <ion-router-outlet id="main-content" main></ion-router-outlet>

  <ion-content [fullscreen]="true">
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button routerLink="/pide-cita">
          <ion-icon name="calendar"></ion-icon>
          Cita Online
        </ion-tab-button>
        <ion-tab-button routerLink="/tienda-dental">
          <ion-icon name="storefront-outline"></ion-icon>
          Tienda Dental
        </ion-tab-button>
        <ion-tab-button routerLink="/prediagnostico-virtual">
          <ion-icon name="pulse-outline"></ion-icon>
          Pre Diagnostico Virtual 
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-content>

</ion-app>
