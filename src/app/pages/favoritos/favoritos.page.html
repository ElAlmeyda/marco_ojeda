<ion-header [translucent]="true">
  <ion-toolbar style="padding-top: var(--ion-safe-area-top); padding-inline: 10px;">
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" class="favs-content">

  <!-- Segmentos -->
  <div class="segment-wrapper">
    <ion-segment [(ngModel)]="segmentoSeleccionado" value="tatuadores" class="custom-segment">
      <ion-segment-button value="tatuadores" class="custom-segment-btn">
        <ion-label>{{ 'FAVS.TATTOO_ARTISTS' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="fotos" class="custom-segment-btn">
        <ion-label>{{ 'FAVS.PHOTOS' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <!-- ── Segmento: Tatuadores ── -->
  <ng-container *ngIf="segmentoSeleccionado === 'tatuadores'">

    <div class="empty-state" *ngIf="usuario.uid === '' || (favoritos && favoritos.length === 0)">
      <div class="empty-icon-wrap">
        <ion-icon name="star-outline"></ion-icon>
      </div>
      <p class="empty-text">{{ 'FAVS.NO_FAVORITES' | translate }}</p>
    </div>

    <div class="favs-list" *ngIf="favoritos && favoritos.length !== 0">
      <div class="fav-row" *ngFor="let fav of favoritos" (click)="irAlTatuador(fav)">
        <div class="fav-avatar">
          <ion-img [src]="fav.avatar || 'assets/icon/sin_avatar.png'"></ion-img>
        </div>
        <span class="fav-name">{{ fav.nombreTienda }}</span>
        <button class="star-btn"
          (click)="fav.fav ? disfav(fav) : like(fav); $event.stopPropagation()">
          <ion-icon [name]="fav.fav ? 'star' : 'star-outline'"
            [class.star-active]="fav.fav"></ion-icon>
        </button>
      </div>
    </div>

  </ng-container>

  <!-- ── Segmento: Fotos ── -->
  <ng-container *ngIf="segmentoSeleccionado === 'fotos'">

    <div class="empty-state" *ngIf="!fotosFavoritas || fotosFavoritas.length === 0">
      <div class="empty-icon-wrap">
        <ion-icon name="heart-outline"></ion-icon>
      </div>
      <p class="empty-text">{{ 'NO_PHOTOS' | translate }}</p>
    </div>

    <div class="photos-grid" *ngIf="fotosFavoritas && fotosFavoritas.length > 0">
      <div class="photo-tile" *ngFor="let foto of fotosFavoritas; let i = index">

        <!-- Skeleton loader -->
        <div class="photo-skeleton" *ngIf="!imagenCargada[i]">
          <ion-spinner name="crescent"></ion-spinner>
        </div>

        <ion-img
          [src]="foto.url"
          (ionImgWillLoad)="onImgWillLoad(i)"
          (ionImgDidLoad)="onImgDidLoad(i)"
          (click)="irAlTatuadorFav(foto.tatuadorId)"
          class="photo-img">
        </ion-img>

        <!-- Heart button -->
        <button class="heart-btn" (click)="toggleFavoritoFoto(foto, $event)">
          <ion-icon [name]="foto.favorita ? 'heart' : 'heart-outline'"
            [class.heart-active]="foto.favorita"></ion-icon>
        </button>

      </div>
    </div>

  </ng-container>

</ion-content>
