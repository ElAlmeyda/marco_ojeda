

<ion-content [fullscreen]="true">
  <ion-list >
    <ion-item *ngFor="let fav of favoritos">
      <ion-avatar>
        <ion-img [src]="fav.foto"></ion-img>
      </ion-avatar>
      <ion-label>{{fav.nombre}}</ion-label>
      <ion-icon slot="end" name="star" *ngIf="fav.favorito" (click)="disfav(fav)"></ion-icon>
      <ion-icon slot="end" name="star-outline" *ngIf="!fav.favorito" (click)="like(fav)"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
