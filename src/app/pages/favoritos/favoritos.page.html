

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item lines="none" *ngFor="let fav of favoritos">
      <ion-avatar style="margin-right: 12px;" [routerLink]="['/tatuador', fav.uid]">
        <ion-img [src]="fav.avatar"></ion-img>
      </ion-avatar>
      <ion-label [routerLink]="['/tatuador', fav.uid]">{{fav.nombreTienda}}</ion-label>
      <ion-icon slot="end" name="star" *ngIf="fav.fav" (click)="disfav(fav)"></ion-icon>
      <ion-icon slot="end" name="star-outline" *ngIf="!fav.fav" (click)="like(fav)"></ion-icon>
    </ion-item>

    <ion-item lines="none" *ngIf="favoritos && favoritos.length === 0">
      <ion-label style="display: flex; justify-content: center; margin-top: 20px;">
          No tienes ningun tatuador favorito
        </ion-label>
    </ion-item>
    <div style="display: flex; justify-content: center; margin-top: 20px;" *ngIf="favoritos && favoritos.length === 0">
      <ion-button fill="outline" [routerLink]="['/tabs/folder', usuario.uid]" style="display: flex; justify-content: center; margin-top: 20px; --border-radius: 12px;">
          ¿Quieres buscar?
        </ion-button>
    </div>
  </ion-list>
</ion-content>
