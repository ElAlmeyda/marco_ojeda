<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-item>
      <ion-avatar class="raton-menu">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>

      <ion-item> 
        <ion-card-title style="margin: auto;">Inicia Sesion </ion-card-title>
      </ion-item>


    </ion-card-header>
    <ion-card-content>

      <form style="text-align: center;" #miForm="ngForm">
        <ion-item>
          <ion-icon name="at-circle" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input [(ngModel)]="credenciales.correo" name="correo" placeholder="Correo" required></ion-input>
        </ion-item>
      
        <ion-item>
          <ion-icon name="key" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input type="password" [(ngModel)]="credenciales.password" name="password" placeholder="Contraseña" required></ion-input>
        </ion-item>
        
        
        <br>
        <ion-button color="primary" (click)="login()" [disabled]="miForm.invalid"> Login </ion-button>
        <ion-button color="primary" routerLink="/registrarse"> Registrate </ion-button>
      </form>
    
    </ion-card-content>
    
  </ion-card>
  
</ion-content>
