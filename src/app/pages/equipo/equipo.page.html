<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-item>
    Atencion al cliente
  </ion-item>
  <ion-grid *ngFor="let item  equipo">
    <ion-row>
      <ion-col style="font-size: 50%;">
        <ion-card [routerLink]="['/especialista', item.id]">
          <ion-img src="{{item.imagen}}" ></ion-img>
          <ion-card-header>
            <ion-card-title>{{item.nombre}}</ion-card-title>
          </ion-card-header>
          <ion-card-content>{{item.descripcion}}</ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>  
</ion-content>
