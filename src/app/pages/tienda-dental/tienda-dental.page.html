<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-item>
      <ion-avatar style="height: 100px; width: 100px; margin-left: 34%;">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      <ion-icon slot="end" name="basket" routerLink="/carrito"></ion-icon>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-searchbar animated="true" placeholder="Busca tu producto"></ion-searchbar>
    <ion-item [routerLink]="['/producto', 1]">
        <ion-avatar slot="start">
          <ion-img></ion-img>
        </ion-avatar>
        <ion-label> Producto </ion-label>
    </ion-item>
    <ion-infinite-scroll>
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ion-list>

</ion-content>
