<ion-header [translucent]="true">
  <ion-toolbar class="toolbar-flex">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <!-- Contenedor para el logo centrado -->
    <div class="center-container">
      <ion-avatar class="raton-menu" routerLink="/folder">
        <ion-img alt="avatar" src="../../../assets/icon/favicon.png"></ion-img>
      </ion-avatar>
    </div>

    <!-- Contenedor para el icono del carrito en el lado derecho -->
    <ion-buttons slot="end">
      <ion-icon class="cart-icon" name="basket" routerLink="/carrito"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-searchbar animated="true" placeholder="Busca tu producto" [(ngModel)]="searchTerm" (ionChange)="buscarProductos()"></ion-searchbar>
    <ion-list *ngFor="let item of store" lines="none">
      <ion-item [routerLink]="['/producto', item.id]">
        <ion-avatar slot="start">
          <ion-img [src]="item.imagenUrl"></ion-img>
        </ion-avatar>
        <ion-label> {{item.nombre}} </ion-label>
        <ion-label>{{item.precio}}€</ion-label>
      </ion-item>
    </ion-list>
    <ion-infinite-scroll>
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ion-list>

</ion-content>
