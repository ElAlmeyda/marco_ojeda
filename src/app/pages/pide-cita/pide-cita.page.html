<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-item>
      <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">


  <ion-card>
    <ion-card-header>

      <ion-item> 
        <ion-card-title style="margin: auto;"> Pedir Cita </ion-card-title>
      </ion-item>


    </ion-card-header>
    <ion-card-content>

      <form style="text-align: center;">
        <ion-item>
          <ion-icon name="clipboard-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-list id="servicio-modal"> Que servicio necesita <br> {{messageServicio}}</ion-list>
          <ion-modal trigger="servicio-modal" >
            <ng-template>
              <ion-header>
                <ion-toolbar>
                  <ion-buttons slot="start">
                    <ion-back-button defaultHref (click)="cancel()"></ion-back-button>
                  </ion-buttons>
                  <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
                </ion-toolbar>
              </ion-header>
              <ion-content>
                <ion-item> Elige el servicio que necesita </ion-item>
                <ion-list *ngFor="let item of servicioDentista" style="padding-left: 20px;"> 
                  <ion-item (click)="confirm()">
                    {{item.nombre}}
                  </ion-item>
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-modal>
        </ion-item>

        <ion-item>
          <ion-icon name="person-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input id="nombre" name="nombre" placeholder="Nombre"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="call-sharp" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input  name="telefono" placeholder="Telefono"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="accessibility-sharp" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-list id="dentista-modal"> Preferencia Dentista <br> {{messageDentista}} </ion-list>
          <ion-modal trigger="dentista-modal" >
            <ng-template>
              <ion-header>
                <ion-toolbar>
                  <ion-buttons slot="start">
                    <ion-back-button defaultHref (click)="cancel()"></ion-back-button>
                  </ion-buttons>
                  <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
                </ion-toolbar>
              </ion-header>
              <ion-content>
                <ion-list>
                
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-modal>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-list id="dia-modal"> Dia <br> {{messageDia}} </ion-list>
          <ion-modal trigger="dia-modal" >
            <ng-template>
              <ion-header>
                <ion-toolbar>
                  <ion-back-button slot="start" defaultHref (click)="cancel()"></ion-back-button>
                  <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
                </ion-toolbar>
              </ion-header>
              <ion-content>
                <ion-list>
                
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-modal>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-number-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-list id="horario-modal"> Horario <br> {{messageHorario}}</ion-list>
          <ion-modal trigger="horario-modal" >
            <ng-template>
              <ion-header>
                <ion-toolbar>
                  <ion-buttons slot="start">
                    <ion-back-button defaultHref (click)="cancel()"></ion-back-button>
                  </ion-buttons>
                  <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
                </ion-toolbar>
              </ion-header>
              <ion-content>
                <ion-list>
                
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-modal>
        </ion-item>
        
        <br>
        <ion-button color="yellow"> Aceptar </ion-button>
        
      </form>
    
    </ion-card-content>
    
  </ion-card>
</ion-content>
