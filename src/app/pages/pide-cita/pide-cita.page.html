<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-item>
      <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">


  <ion-card>
    <ion-card-header>

      <ion-item> 
        <ion-card-title style="margin: auto;"> Pedir Cita </ion-card-title>
      </ion-item>


    </ion-card-header>
    <ion-card-content>

      <form style="text-align: center;">
        <ion-item>
          <ion-icon name="clipboard-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          
          <ion-select label="Que servicio necesita" label-placement="stacked">
            <ion-select-option> 1º Visita </ion-select-option>
            <ion-select-option> Brackets </ion-select-option>
            <ion-select-option> Limpieza </ion-select-option>
            <ion-select-option> Implantar </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-icon name="person-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input id="nombre" name="nombre" placeholder="Nombre"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="call-sharp" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input  name="telefono" placeholder="Telefono"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="accessibility-sharp" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-select label="Dentista" label-placement="stacked">
            <ion-select-option> Ninguna Preferencia </ion-select-option>
            <ion-select-option> Marco Ojeda </ion-select-option>
            <ion-select-option> Omar Ojeda </ion-select-option>
            <ion-select-option> Lisney </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-list id="dia-modal"> Dia <br> {{messageDia}} </ion-list>
          <ion-modal trigger="dia-modal" >
            <ng-template>
              <ion-header>
                <ion-toolbar>
                  <ion-back-button slot="start" defaultHref (click)="cancel()"></ion-back-button>
                  <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
                    <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
                    </ion-img>
                  </ion-avatar>
                </ion-toolbar>
              </ion-header>
              <ion-content>
                <ion-list>
                
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-modal>
        </ion-item>

        <ion-item>
          <ion-icon name="calendar-number-outline" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-select label="Horario" label-placement="stacked">
            <ion-select-option> Mañana </ion-select-option>
            <ion-select-option> Tarde </ion-select-option>
          </ion-select>
        </ion-item>
        
        <br>
        <ion-button color="primary"> Aceptar </ion-button>
        
      </form>
    
    </ion-card-content>
    
  </ion-card>
</ion-content>
