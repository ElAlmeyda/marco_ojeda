<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-item>
      <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-header>

      <ion-item> 
        <ion-card-title style="margin: auto;"> Perfil de {{usuario.nombre}} </ion-card-title>
        <ion-icon slot="end" name="arrow-forward-outline" routerLink="/editar-perfil"></ion-icon>
      </ion-item>


    </ion-card-header>
    <ion-card-content>
      <ion-item> Su movil: {{usuario.movil}}</ion-item>
      <ion-item> Su correo: {{usuario.correo}}</ion-item>

      <ion-item> Su cita: 13/01/2024 09:00</ion-item>
    </ion-card-content>
  </ion-card>
  
</ion-content>
