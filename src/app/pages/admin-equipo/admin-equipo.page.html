<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/administrador"></ion-back-button>
    </ion-buttons>
    <ion-item>
      <ion-avatar class="raton-menu">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div style="display: flex; justify-content: center; margin-top: 20px;">
    <ion-button routerLink="/agregar-user" >Añadir Empleado</ion-button>
  </div>

  <ion-card *ngFor="let item of equipo" style="font-family: 'Montserrat', sans-serif;">
    <ion-card-header [routerLink]="['/editar-user', item.id]">
      <ion-card-title > {{item.nombre}} </ion-card-title>
    </ion-card-header>
    <ion-card-content> {{item.descripcion}}</ion-card-content>
    <ion-card-content style="text-align: right;"> 
      <ion-icon name="trash-outline" (click)="delete(item)" style="font-size: 24px;"></ion-icon>
    </ion-card-content>
  </ion-card>
</ion-content>
