<ion-header [translucent]="true">
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-back-button defaultHref="/noticias"></ion-back-button>
      </ion-buttons>
      <ion-item>
        <ion-avatar class="raton-menu">
          <ion-img alt="avatar" src="../../../assets/icon/favicon.png" routerLink="/folder">
          </ion-img>
        </ion-avatar>
        
      </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let item of noticia">
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-img alt="noticia" [src]="item.imagenUrl"></ion-img>
        </ion-col>
        <ion-col size="12">
          <ion-card-header>
            <ion-card-title>{{item.titulo}}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            {{item.descripcion}}
          </ion-card-content>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
