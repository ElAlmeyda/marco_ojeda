<ion-header [translucent]="true">
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-back-button defaultHref="/noticias"></ion-back-button>
      </ion-buttons>
      <ion-item>
        <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
          <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
          </ion-img>
        </ion-avatar>
        
      </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let item of noticias">
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-img alt="noticia" [src]="item.imagen"></ion-img>
        </ion-col>
        <ion-col size="5">
          <ion-card-header>
            <ion-card-title>{{item.titulo}}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            {{item.informacion}}
          </ion-card-content>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card>
</ion-content>
