<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tienda-dental"></ion-back-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-item class="center-title">
      <ion-avatar class="raton-menu">
        <ion-img alt="avatar" src="../../../assets/icon/favicon.png" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <!-- Lista de productos en el carrito -->
    <ion-card>
      <ion-item> Su precio total: {{calcularTotalEnCarrito()}}€</ion-item>
      <ion-list *ngFor="let item of carrito.productos; let i = index">
        <ion-item>
          <ion-thumbnail slot="start">
            <ion-img src="{{item.producto.foto}}" alt="Imagen del producto"></ion-img>
          </ion-thumbnail>
          <ion-label>
            <h2 style="font-size: 10px; color:gray;">{{item.producto.nombre}}</h2>
            <h2>{{item.producto.precio}} €</h2>
          </ion-label>

          <ion-icon name="remove-outline" (click)="menos(item)"></ion-icon>
          <label> {{item.cantidad}} </label>
          <ion-icon name="add-outline" (click)="mas(item)"></ion-icon>
          
          
          <ion-icon name="trash-outline" slot="end" (click)="eliminarDelCarrito(item)"></ion-icon>
        </ion-item>
      </ion-list>

      <ion-card *ngIf="carrito.productos.length === 0">
        <ion-card-content>
          <p>¡Tu carrito está vacío!</p>
        </ion-card-content>
      </ion-card>
      <ion-button expand="full" color="success" (click)="procesarPago()"> Pagar </ion-button>      


      <ion-button expand="full" color="danger" (click)="limpiarCarrito()">
        Limpiar Carrito
      </ion-button>      
    </ion-card>
</ion-content>
