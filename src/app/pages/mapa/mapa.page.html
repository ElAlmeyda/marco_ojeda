<ion-header>
  <ion-toolbar style="padding-top: var(--ion-safe-area-top); padding-inline: 10px;">
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">

  <!-- Back button -->
  <button class="map-back-btn" [routerLink]="['/tabs/folder', usuario.uid]">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </button>

  <div id="map"></div>

  <!-- Artist card -->
  <div class="map-artist-card" *ngIf="tatuadorSeleccionado">

    <!-- Close -->
    <button class="map-card-close" (click)="tatuadorSeleccionado = null">
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <!-- Image -->
    <div class="map-card-img-wrap" [routerLink]="['/tatuador', tatuadorSeleccionado.uid]">
      <ion-skeleton-text *ngIf="!imagenCargada" animated class="map-card-skeleton"></ion-skeleton-text>
      <ion-img
        [src]="tatuadorSeleccionado.avatar || 'assets/icon/sin_avatar.png'"
        class="map-card-img"
        (ionImgDidLoad)="imagenCargada = true">
      </ion-img>
      <div class="map-card-img-overlay"></div>
    </div>

    <!-- Info -->
    <div class="map-card-body">
      <p class="map-card-label">TATTOO ARTIST</p>
      <h2 class="map-card-name" [routerLink]="['/tatuador', tatuadorSeleccionado.uid]">
        {{ tatuadorSeleccionado.nombreTienda }}
      </h2>
      <div class="map-card-meta">
        <span class="map-card-meta-item" *ngIf="tatuadorSeleccionado.distancia">
          <ion-icon name="location-outline"></ion-icon>
          {{ tatuadorSeleccionado.distancia | number:'1.0-1' }} km
        </span>
        <span class="map-card-divider" *ngIf="tatuadorSeleccionado.distancia">·</span>
        <span class="map-card-meta-item map-card-rating">
          <ion-icon name="star"></ion-icon>
          {{ tatuadorSeleccionado.promedio?.toFixed(1) || 'S/V' }}
        </span>
      </div>
    </div>

    <!-- CTA -->
    <button class="map-card-cta" [routerLink]="['/tatuador', tatuadorSeleccionado.uid]">
      Ver perfil
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

  </div>

</ion-content>
