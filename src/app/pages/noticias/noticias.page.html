<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-img src="../../assets/icon/o_1cj31qpibjo51a4vtqf4m65ia.png" style="width: 300px;"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">noticias</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let item of noticias">
    <ion-card-header [routerLink]="['/noticia', item.id]">
      <ion-card-title > {{item.titulo}} </ion-card-title>
    </ion-card-header>
    <ion-card-content> {{item.informacion}}</ion-card-content>
  </ion-card>
  
</ion-content>
