<ion-content [fullscreen]="true">
  <ion-list lines="none" style="margin-top: 30%; background-color: transparent;">
    <ion-card *ngFor="let noticia of noticias" class="noticia-card" (click)="abrirModal(noticia)">
      
      <!-- Imagen -->
      <ion-img 
        *ngIf="noticia.imagenes" 
        [src]="noticia.imagenes" 
        style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px;">
      </ion-img>
      <!-- Contenido -->
      <ion-card-header>
        <ion-card-title>{{ noticia.titulo }}</ion-card-title>
        <ion-card-subtitle>{{ noticia.fecha?.toDate() | date:'short' }}</ion-card-subtitle>
      </ion-card-header>
    </ion-card>
  </ion-list>
  <ion-modal #modal>
    <ng-template>
      <ion-header style="margin-top: 60px;">
        <ion-toolbar>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">{{ 'CLOSE' | translate }}</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-img 
          *ngIf="noticiaSeleccionada?.imagenes" 
          [src]="noticiaSeleccionada.imagenes" 
          style="width: 100%; height: 250px; object-fit: cover;">
        </ion-img>

       <ion-card-content>
        <h1 class="titulo-noticia">{{ noticiaSeleccionada?.titulo }}</h1>
        <p class="fecha-noticia">{{ noticiaSeleccionada?.fecha?.toDate() | date:'fullDate' }}</p>
        <p class="descripcion-noticia">{{ noticiaSeleccionada?.descripcion }}</p>
      </ion-card-content>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
