<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/perfil"></ion-back-button>
  </ion-buttons>
  <ion-item>
    <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
      <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
      </ion-img>
    </ion-avatar>
    
  </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"> Perfil </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card >
    <ion-card-header>

      <ion-item> 
        <ion-card-title style="margin: auto;"> Bienvenido {{usuario.nombre}} </ion-card-title>
      </ion-item>


    </ion-card-header>
    <ion-card-content>

      <form style="text-align: center;">
        <ion-item>
          <ion-icon name="person" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input name="nombre" placeholder="{{usuario.nombre}}" [(ngModel)]="actualizarUser.nombre"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="call" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input id="movil" name="movil" placeholder="{{usuario.movil}}" [(ngModel)]="actualizarUser.movil"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="at-circle" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input name="correo" placeholder="{{usuario.correo}}" [(ngModel)]="actualizarUser.correo"></ion-input>
        </ion-item>
        
        <ion-item>
          <ion-icon name="key" style=" font-size: 30px; padding-right: 10px;"></ion-icon>
          <ion-input type="password" name="password" placeholder="{{usuario.password}}" [(ngModel)]="actualizarUser.password"></ion-input>
        </ion-item>
        
        
        <br>
        <ion-button (click)="editar()"> Editar </ion-button>
      </form>
    
    </ion-card-content>
    
  </ion-card>
</ion-content>
