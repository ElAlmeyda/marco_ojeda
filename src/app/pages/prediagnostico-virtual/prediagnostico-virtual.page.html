<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-item>
      <ion-avatar style="height: 100px; width: 100px; margin-left: 30%;">
        <ion-img alt="avatar" src="../../../assets/icon/Sin1.jpg" routerLink="/folder">
        </ion-img>
      </ion-avatar>
      
    </ion-item>
  </ion-toolbar>
</ion-header>



<ion-content [fullscreen]="true">

  <ion-card-content>
    <ion-item> 
      <ion-card-title style="margin: auto;"> Prediagnostico Virtual </ion-card-title>
    </ion-item>

    <form style="text-align: center;">
      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Nombre"></ion-textarea>
      </ion-item>
      
      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Fecha de nacimiento"></ion-textarea>
      </ion-item>
      
      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Padece alguna enfermedad"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Medicamento"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Embarazada"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-icon name="send" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-textarea placeholder="Alergias"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-icon name="image-outline" style="font-size: 30px; padding-right: 10px;"></ion-icon>
        <ion-input name="foto" type="file"></ion-input>
      </ion-item>

      <ion-item>
        <ion-buttons slot="end">
          <ion-button routerLink="/confirmar-prediagnostico"> Siguiente Paso </ion-button>
        </ion-buttons>
      </ion-item>
    </form>
  
  </ion-card-content>


</ion-content>
